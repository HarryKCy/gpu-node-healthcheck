apiVersion: 1
# A dedicated name avoids replacing manually configured Prometheus sources.
datasources:
  - name: GPU Node Prometheus
    uid: gpu-node-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: false
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 15s
